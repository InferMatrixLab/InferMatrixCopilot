[project]
name = "infermatrix-copilot"
version = "0.2.0"
description = "InferMatrixCopilot — playbook-driven repo-maintenance agent (engine substrate, targets, adapters, conversational CLI)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "PyYAML>=6.0",
    "anthropic>=0.34",
    "openai>=1.50",
    "rich>=13.0",
    "markdown-it-py>=3",
    "jsonschema>=4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# MCP server (Claude Code / Codex integration) — kept optional so a standalone
# CLI install stays dependency-free.
mcp = ["mcp>=1.8,<2"]
# Knowledge service (signing, verdict envelopes).
kb = ["cryptography>=42"]
# Composition-based DeepSeek adapter: later SDKs removed cordis/session_root.
deepseek = ["deepseek-harness-sdk==0.1.0rc6"]

[project.scripts]
infermatrix-copilot = "infermatrix_copilot.cli:main"
infermatrix-copilot-mcp = "infermatrix_copilot.thin_mcp_server:main"
infermatrix-copilot-workflow-mcp = "infermatrix_copilot.mcp_server:main"
infermatrix-rfc = "infermatrix_copilot.rfc_service.cli:main"
imx-omni-pytest = "infermatrix_copilot.rebase_engine.module_pytest:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/infermatrix_copilot"]

[tool.hatch.build.targets.wheel.force-include]
"knowledge" = "infermatrix_copilot/knowledge"
"playbooks" = "infermatrix_copilot/_runtime/playbooks"
"adapters" = "infermatrix_copilot/_runtime/adapters"
"skills" = "infermatrix_copilot/_runtime/skills"
"doc/knowledge/SCHEMA.md" = "infermatrix_copilot/_runtime/knowledge-schema.md"
"doc/knowledge" = "infermatrix_copilot/doc/knowledge"
"plugins/infermatrix-copilot/skills" = "infermatrix_copilot/_runtime/host_skills"
"doc/features/rfc-service.md" = "infermatrix_copilot/_runtime/docs/rfc-service.md"

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "-q"
